name: Fail-Closed Quality Gates

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'packages/shared/**'
      - 'ops/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'lint-staged.config.js'
      - 'package.json'

jobs:
  non-mutating-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史做 diff

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Frontend format check
        run: cd frontend && npm run format:check

      - name: Frontend lint (no fix)
        run: cd frontend && ./node_modules/.bin/eslint . --ext .js,.ts,.vue --max-warnings 0

      - name: Backend lint (no fix)
        run: cd backend && ./node_modules/.bin/eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0 --no-fix

  gates:
    name: Build & Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            packages/shared/package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install shared deps
        run: cd packages/shared && npm ci

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run reproducible quality gate chain
        run: node tools/ci/run-quality-gates.js

      - name: Gate contract self-tests
        run: node --test tools/ci/quality-gates-meta.test.js
