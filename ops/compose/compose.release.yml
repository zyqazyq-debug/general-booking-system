name: booking-prod-release

x-backend-common: &backend-common
  restart: unless-stopped
  env_file:
    - ${BOOKING_RUNTIME_ENV_FILE:?set non-secret runtime env file}
  secrets:
    - postgres_password
    - redis_password
    - jwt_secret_1
    - jwt_secret_2
    - telegram_bot_token
    - telegram_webhook_secret
  networks: [prod-edge, prod-data]
  read_only: true
  tmpfs: [/tmp, /app/logs]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/livez',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-gateway-common: &gateway-common
  restart: unless-stopped
  networks: [prod-edge]
  read_only: true
  tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
  cap_drop: ["ALL"]
  cap_add: ["NET_BIND_SERVICE"]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/livez"]
    interval: 10s
    timeout: 5s
    retries: 12

services:
  telegram-webhook-set:
    <<: *backend-common
    profiles: ["telegram-webhook-set"]
    image: ${BOOKING_BACKEND_IMAGE:?set immutable backend image repository}@${BOOKING_MIGRATION_BACKEND_DIGEST:?set candidate backend digest}
    restart: "no"
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      BOOKING_RUNTIME_ROLE: standby
      BOOKING_WORKERS_ENABLED: "false"
      ORDER_OUTBOX_DISPATCH_ENABLED: "false"
      TELEGRAM_ENABLE_WEBHOOK: "false"
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE: /run/secrets/telegram_webhook_secret
    command:
      - node
      - dist/src/scripts/set-telegram-webhook.js
      - --action=set
      - --environment=production
      - --expected-bot-id=${BOOKING_TELEGRAM_EXPECTED_BOT_ID:-}
      - --expected-bot-username=${BOOKING_TELEGRAM_EXPECTED_BOT_USERNAME:-}
      - --url=${BOOKING_TELEGRAM_WEBHOOK_URL:?set exact production Telegram webhook URL}
      - --ready-url=https://app.happybooking.uk/readyz
      - --expected-release-id=${BOOKING_WEBHOOK_RELEASE_ID:?set active candidate release id}
      - --expected-git-sha=${BOOKING_WEBHOOK_GIT_SHA:?set active candidate Git SHA}
      - --expected-manifest-digest=${BOOKING_WEBHOOK_MANIFEST_DIGEST:?set active candidate manifest digest}
      - --expected-config-schema=${BOOKING_CONFIG_SCHEMA_VERSION:?set release config schema}
      - --expected-migration-floor=${BOOKING_MIGRATION_FLOOR:?set manifest migration floor}
      - --expected-migration-catalog-digest=${BOOKING_MIGRATION_CATALOG_DIGEST:?set manifest migration catalog digest}
    depends_on:
      schema-migrate:
        condition: service_completed_successfully

  schema-migrate:
    <<: *backend-common
    profiles: ["migrate", "telegram-webhook-set"]
    image: ${BOOKING_BACKEND_IMAGE:?set immutable backend image repository}@${BOOKING_MIGRATION_BACKEND_DIGEST:?set migration backend digest}
    # The immutable backup receipt is root:root 0600 on the host. Limit the
    # root exception to this receipt-reading one-shot; the shared hardening
    # anchor still removes capabilities and keeps the root filesystem read-only.
    user: "0:0"
    restart: "no"
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      BOOKING_SCHEMA_MIGRATE: "true"
      BOOKING_MIGRATION_EXPECTED_DATABASE: ${POSTGRES_DB:?acknowledge migration database}
      BOOKING_MIGRATION_ENVIRONMENT: production
      BOOKING_MIGRATION_EXPECTED_FLOOR: ${BOOKING_MIGRATION_FLOOR:?set manifest migration floor}
      BOOKING_MIGRATION_CATALOG_DIGEST: ${BOOKING_MIGRATION_CATALOG_DIGEST:?set manifest migration catalog digest}
      BOOKING_MIGRATION_APPROVED_PENDING_JSON: ${BOOKING_MIGRATION_APPROVED_PENDING_JSON:?set exact approved pending migration JSON array}
      BOOKING_MIGRATION_BACKUP_RECEIPT_FILE: /run/booking-evidence/backup-receipt.json
      BOOKING_MIGRATION_BACKUP_RECEIPT_DIGEST: ${BOOKING_MIGRATION_BACKUP_RECEIPT_DIGEST:?set exact backup receipt digest}
      BOOKING_MIGRATION_CATALOG_DIR: /app/migration-source
      BOOKING_RELEASE_ID: ${BOOKING_WEBHOOK_RELEASE_ID:?set candidate release id}
      BOOKING_GIT_SHA: ${BOOKING_WEBHOOK_GIT_SHA:?set candidate Git SHA}
      BOOKING_MANIFEST_DIGEST: ${BOOKING_WEBHOOK_MANIFEST_DIGEST:?set candidate manifest digest}
      USE_POSTGRES: "true"
      TYPEORM_SYNCHRONIZE: "false"
      BOOKING_RUNTIME_ROLE: migration
      BOOKING_WORKERS_ENABLED: "false"
      ORDER_OUTBOX_DISPATCH_ENABLED: "false"
      TELEGRAM_ENABLE_WEBHOOK: "false"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET1_FILE: /run/secrets/jwt_secret_1
      JWT_SECRET2_FILE: /run/secrets/jwt_secret_2
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE: /run/secrets/telegram_webhook_secret
    command: ["node", "dist/src/scripts/run-migrations.js"]
    volumes:
      - type: bind
        source: ${BOOKING_MIGRATION_BACKUP_RECEIPT_HOST_FILE:?set verified backup receipt file}
        target: /run/booking-evidence/backup-receipt.json
        read_only: true

  backend-blue:
    <<: *backend-common
    profiles: ["blue"]
    image: ${BOOKING_BACKEND_IMAGE:?set immutable backend image repository}@${BOOKING_BLUE_BACKEND_DIGEST:?set blue backend digest}
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret_1
      - jwt_secret_2
      - telegram_bot_token
      - telegram_webhook_secret
      - telegram_data_encryption_secret
    environment:
      BOOKING_RELEASE_ID: ${BOOKING_BLUE_RELEASE_ID:?set blue release id}
      BOOKING_GIT_SHA: ${BOOKING_BLUE_GIT_SHA:?set blue Git SHA}
      BOOKING_SLOT: blue
      BOOKING_MANIFEST_DIGEST: ${BOOKING_BLUE_MANIFEST_DIGEST:?set blue manifest digest}
      BOOKING_CONFIG_SCHEMA_VERSION: ${BOOKING_CONFIG_SCHEMA_VERSION:?set config schema}
      BOOKING_MIGRATION_FLOOR: ${BOOKING_BLUE_MIGRATION_FLOOR:?set migration floor}
      BOOKING_MIGRATION_CATALOG_DIGEST: ${BOOKING_MIGRATION_CATALOG_DIGEST:?set manifest migration catalog digest}
      BOOKING_RUNTIME_ROLE: ${BOOKING_BLUE_RUNTIME_ROLE:-standby}
      BOOKING_WORKERS_ENABLED: ${BOOKING_BLUE_WORKERS_ENABLED:-false}
      ORDER_OUTBOX_DISPATCH_ENABLED: ${BOOKING_BLUE_ORDER_OUTBOX_DISPATCH_ENABLED:-false}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET1_FILE: /run/secrets/jwt_secret_1
      JWT_SECRET2_FILE: /run/secrets/jwt_secret_2
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE: /run/secrets/telegram_webhook_secret
      TELEGRAM_DATA_ENCRYPTION_SECRET_FILE: /run/secrets/telegram_data_encryption_secret

  gateway-blue:
    <<: *gateway-common
    profiles: ["blue"]
    image: ${BOOKING_GATEWAY_IMAGE:?set immutable gateway image repository}@${BOOKING_BLUE_GATEWAY_DIGEST:?set blue gateway digest}
    environment:
      BOOKING_BACKEND_UPSTREAM: backend-blue:3001
      NGINX_ENVSUBST_FILTER: BOOKING_BACKEND_UPSTREAM
    networks:
      prod-edge:
        aliases: [gateway-blue]
    depends_on:
      backend-blue:
        condition: service_healthy

  backend-green:
    <<: *backend-common
    profiles: ["green"]
    image: ${BOOKING_BACKEND_IMAGE:?set immutable backend image repository}@${BOOKING_GREEN_BACKEND_DIGEST:?set green backend digest}
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret_1
      - jwt_secret_2
      - telegram_bot_token
      - telegram_webhook_secret
      - telegram_data_encryption_secret
    environment:
      BOOKING_RELEASE_ID: ${BOOKING_GREEN_RELEASE_ID:?set green release id}
      BOOKING_GIT_SHA: ${BOOKING_GREEN_GIT_SHA:?set green Git SHA}
      BOOKING_SLOT: green
      BOOKING_MANIFEST_DIGEST: ${BOOKING_GREEN_MANIFEST_DIGEST:?set green manifest digest}
      BOOKING_CONFIG_SCHEMA_VERSION: ${BOOKING_CONFIG_SCHEMA_VERSION:?set config schema}
      BOOKING_MIGRATION_FLOOR: ${BOOKING_GREEN_MIGRATION_FLOOR:?set migration floor}
      BOOKING_MIGRATION_CATALOG_DIGEST: ${BOOKING_MIGRATION_CATALOG_DIGEST:?set manifest migration catalog digest}
      BOOKING_RUNTIME_ROLE: ${BOOKING_GREEN_RUNTIME_ROLE:-standby}
      BOOKING_WORKERS_ENABLED: ${BOOKING_GREEN_WORKERS_ENABLED:-false}
      ORDER_OUTBOX_DISPATCH_ENABLED: ${BOOKING_GREEN_ORDER_OUTBOX_DISPATCH_ENABLED:-false}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      JWT_SECRET1_FILE: /run/secrets/jwt_secret_1
      JWT_SECRET2_FILE: /run/secrets/jwt_secret_2
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_WEBHOOK_SECRET_TOKEN_FILE: /run/secrets/telegram_webhook_secret
      TELEGRAM_DATA_ENCRYPTION_SECRET_FILE: /run/secrets/telegram_data_encryption_secret

  gateway-green:
    <<: *gateway-common
    profiles: ["green"]
    image: ${BOOKING_GATEWAY_IMAGE:?set immutable gateway image repository}@${BOOKING_GREEN_GATEWAY_DIGEST:?set green gateway digest}
    environment:
      BOOKING_BACKEND_UPSTREAM: backend-green:3001
      NGINX_ENVSUBST_FILTER: BOOKING_BACKEND_UPSTREAM
    networks:
      prod-edge:
        aliases: [gateway-green]
    depends_on:
      backend-green:
        condition: service_healthy

secrets:
  postgres_password:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/postgres-password
  redis_password:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/redis-password
  jwt_secret_1:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/jwt-secret-1
  jwt_secret_2:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/jwt-secret-2
  telegram_bot_token:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/telegram-bot-token
  telegram_webhook_secret:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/telegram-webhook-secret
  telegram_data_encryption_secret:
    file: ${BOOKING_SECRET_ROOT:?set protected secret root}/telegram-data-encryption-secret

networks:
  prod-edge:
    name: booking-prod-edge
    external: true
  prod-data:
    name: booking-prod-data
    external: true
