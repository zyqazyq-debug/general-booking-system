# Explicit Telegram-only overlay.  It is never selected for a generic
# booking-preprod start; operator activation is a separately fenced action.
services:
  telegram-egress:
    image: ${BOOKING_TELEGRAM_EGRESS_IMAGE:?set egress image repository}@${BOOKING_TELEGRAM_EGRESS_DIGEST:?set immutable egress image digest}
    restart: unless-stopped
    # WARP's system daemon requires root; all ambient capabilities are still
    # dropped and the executor attests this exact explicit user at runtime.
    user: "0:0"
    environment:
      BOOKING_RELEASE_ID: ${BOOKING_RELEASE_ID:?set release id}
      BOOKING_GIT_SHA: ${BOOKING_GIT_SHA:?set release Git SHA}
      BOOKING_MANIFEST_DIGEST: ${BOOKING_MANIFEST_DIGEST:?set canonical manifest digest}
      BOOKING_TELEGRAM_EGRESS_DIGEST: ${BOOKING_TELEGRAM_EGRESS_DIGEST:?set immutable egress image digest}
    read_only: true
    tmpfs: [/tmp, /run, /var/log/cloudflare-warp]
    volumes:
      - telegram-warp-state:/var/lib/cloudflare-warp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    # DS218+ exposes neither the Docker PIDs controller nor the CPU CFS
    # controller.  Compose discards `pids_limit` and rejects `cpus` before the
    # container is created, so do not claim limits this host cannot enforce.
    # The service remains memory-bounded and isolated by its dedicated
    # topology, read-only root, dropped capabilities and private networks.
    networks: [preprod-telegram, preprod-warp-uplink]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  backend-green:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    # Compose appends this sequence to the base service networks.  The
    # executor also validates the rendered JSON before every staged mutation.
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  backend-blue:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  order-worker-green:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  order-worker-blue:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  telegram-bot-identity:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  telegram-webhook-set:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

  telegram-webhook-readback:
    environment:
      BOOKING_TELEGRAM_EGRESS_REQUIRED: "true"
      TELEGRAM_PROXY_URL: socks5h://telegram-egress:1080
    networks: [preprod-telegram]
    depends_on:
      telegram-egress:
        condition: service_healthy

networks:
  preprod-telegram:
    name: booking-preprod-telegram
    internal: true
  preprod-warp-uplink:
    name: booking-preprod-warp-uplink

volumes:
  telegram-warp-state:
    name: booking-preprod-telegram-warp-state
