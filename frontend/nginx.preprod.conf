server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(livez|readyz|__ops/version)$ { proxy_pass http://backend-green:3001; }
  location /api/ { proxy_pass http://backend-green:3001; }
  location = /telegram/webhook { proxy_pass http://backend-green:3001; }
  location / { try_files $uri $uri/ /index.html; }
}
